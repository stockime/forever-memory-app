# Builds Forever Memory for Linux, macOS and Windows and publishes a release
# with the armory addon, whenever a v* tag is pushed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: macos-14
            name: macos
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p dist/forever-memory
          cp target/release/forever-memory packaging/forever-memory.desktop README.md dist/forever-memory/
          tar -C dist -czf forever-memory-linux-x86_64.tar.gz forever-memory
      - name: Package (macOS, universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          app="dist/Forever Memory.app/Contents"
          mkdir -p "$app/MacOS"
          lipo -create -output "$app/MacOS/forever-memory" \
            target/aarch64-apple-darwin/release/forever-memory \
            target/x86_64-apple-darwin/release/forever-memory
          version="${GITHUB_REF_NAME#v}"
          sed "s/VERSION/${version}/g" packaging/Info.plist > "$app/Info.plist"
          codesign --force --deep --sign - "dist/Forever Memory.app"
          (cd dist && ditto -c -k --keepParent "Forever Memory.app" ../forever-memory-macos.zip)
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory dist/forever-memory | Out-Null
          Copy-Item target/release/forever-memory.exe, README.md dist/forever-memory/
          Compress-Archive -Path dist/forever-memory -DestinationPath forever-memory-windows-x86_64.zip
      - name: Addon
        if: runner.os == 'Linux'
        run: |
          mkdir -p addon-dist/armory
          cp addon/armory.toc addon/armory.lua addon/memory.lua addon/README.md addon-dist/armory/
          (cd addon-dist && zip -r ../armory-addon.zip armory)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            forever-memory-*.tar.gz
            forever-memory-*.zip
            armory-addon.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          notes="$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Forever Memory ${GITHUB_REF_NAME#v}" --notes "${notes:-Forever Memory ${GITHUB_REF_NAME}}"
